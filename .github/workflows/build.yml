name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'master'

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: 'builds'
          path: 'builds'

      - name: Clean old builds
        run: |
          rm -f $GITHUB_WORKSPACE/builds/*.cs3
          rm -f $GITHUB_WORKSPACE/builds/plugins.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          cd $GITHUB_WORKSPACE/master
          chmod +x gradlew

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/master
          ./gradlew make

      - name: Move artifacts to builds
        run: |
          cp -f $GITHUB_WORKSPACE/master/build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp -f $GITHUB_WORKSPACE/master/build/plugins.json $GITHUB_WORKSPACE/builds/repo.json || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Build artifacts" || exit 0
          git push origin builds
